name: Site

# The website at https://telaui.dev (ADR-206). Pushes and pull requests that
# touch the site or the docs build it as a check; main and release tags
# deploy it with the docs of the latest release tag.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/wiki/**"
      - "docs/images/**"
      - "docs/llms.txt"
      - ".github/workflows/site.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "site/**"
      - "docs/wiki/**"
      - "docs/images/**"
      - "docs/llms.txt"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the site with the docs of the checked-out commit.
  check:
    name: check (build and links)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  # The Go snippets of the landing page compile, and their PNGs are what
  # tela snapshot renders from the committed sources (byte for byte).
  snippets:
    name: snippets (compile and PNGs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            site/snippets/go.sum
      - run: (cd snippets && CGO_ENABLED=0 go vet ./...)
      - run: scripts/render-snippets.sh --check

  # Builds the site code of main with the docs of the latest release tag.
  build:
    name: build (docs of the latest release)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Extract the docs of the latest release tag
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*')"
          echo "Docs of $tag"
          mkdir -p "$RUNNER_TEMP/docs-src"
          git archive "$tag" docs/wiki docs/images docs/llms.txt | tar -x -C "$RUNNER_TEMP/docs-src"
          echo "TELA_DOCS_DIR=$RUNNER_TEMP/docs-src/docs" >> "$GITHUB_ENV"
          echo "TELA_VERSION=$tag" >> "$GITHUB_ENV"
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploys wait for each other; checks never queue behind them.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages names a Pages deployment after GITHUB_SHA, and a
      # second deployment of the same commit is a no-op: a release tag pushed
      # on the commit main already deployed never published its docs. This
      # does what deploy-pages does, with a build version unique to the run.
      - id: deployment
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = `${context.sha}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, name: 'github-pages',
            });
            if (data.artifacts.length !== 1) {
              core.setFailed(`expected one github-pages artifact, found ${data.artifacts.length}`);
              return;
            }
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: data.artifacts[0].id,
              pages_build_version: version,
              oidc_token: await core.getIDToken(),
            });
            core.info(`Pages deployment ${deployment.id} (${version})`);
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_attempt_error'];
            for (let i = 0; i < 120; i++) {
              const { data: state } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {
                owner, repo, id: deployment.id,
              });
              if (state.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (failed.includes(state.status)) {
                core.setFailed(`Pages deployment ${deployment.id}: ${state.status}`);
                return;
              }
              await new Promise((r) => setTimeout(r, 5000));
            }
            core.setFailed(`Pages deployment ${deployment.id} did not finish in 10 minutes`);
