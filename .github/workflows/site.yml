name: Site

# The website at https://telaui.dev (ADR-206, ADR-229). Pushes to main and
# pull requests that touch the site or the docs build it as a check; only
# tags deploy it, so the site never shows docs of an untagged version:
#   - a release tag (v*) deploys the whole site from that tag (site code,
#     snippets and docs);
#   - a site tag (site-YYYY-MM-DD, -2, -3 for more that day) deploys the
#     site code of its commit with the docs of the latest release tag, for a
#     change to the site between releases;
#   - a manual run (workflow_dispatch) does the same from main's head.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/wiki/**"
      - "docs/images/**"
      - "docs/llms.txt"
      - ".github/workflows/site.yml"
    tags: ["v*", "site-*"]
  pull_request:
    paths:
      - "site/**"
      - "docs/wiki/**"
      - "docs/images/**"
      - "docs/llms.txt"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the site with the docs of the checked-out commit.
  check:
    name: check (build and links)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  # The Go snippets of the landing page compile, and their PNGs are what
  # tela snapshot renders from the committed sources (byte for byte).
  snippets:
    name: snippets (compile and PNGs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            site/snippets/go.sum
      - run: (cd snippets && CGO_ENABLED=0 go vet ./...)
      - run: scripts/render-snippets.sh --check

  # A release tag: the whole site from it. A site tag or a manual run: the
  # site code of that commit (main's head for a manual run) with the docs of
  # the latest release tag.
  build:
    name: build (the release's site and docs)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/site-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      # Pages keeps one deployment per commit (actions/deploy-pages names it
      # after GITHUB_SHA): a tag on a commit that another tag (or a manual
      # run) already deployed cannot replace that deployment. Put a site tag
      # and a release tag on different commits, or run this by hand again.
      - name: Pick the docs to publish
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*')"
          if [ "$GITHUB_REF" = "refs/tags/$tag" ]; then
            echo "The site and docs of $tag"
          else
            echo "The site of ${GITHUB_REF#refs/*/} with the docs of $tag"
            mkdir -p "$RUNNER_TEMP/docs-src"
            git archive "$tag" docs/wiki docs/images docs/llms.txt | tar -x -C "$RUNNER_TEMP/docs-src"
            echo "TELA_DOCS_DIR=$RUNNER_TEMP/docs-src/docs" >> "$GITHUB_ENV"
          fi
          echo "TELA_VERSION=$tag" >> "$GITHUB_ENV"
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploys wait for each other; checks never queue behind them.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
