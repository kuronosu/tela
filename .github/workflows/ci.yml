name: CI

on:
  push:
    paths-ignore: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/site.yml"]
  schedule:
    # Weekly run on real Windows (windows-latest), see ARCHITECTURE §18.
    - cron: "0 6 * * 1"
  # Runs the full CI on any branch: `gh workflow run ci.yml --ref <branch>`,
  # required on a work branch before it is merged into main (ADR-220).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STATICCHECK_VERSION: "2026.2.2"

jobs:
  lint:
    name: lint (gofmt, vet, staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet (linux)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: go vet (windows)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: go vet ./...
      - name: go vet (darwin)
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
        run: go vet ./...
      - name: staticcheck
        env:
          CGO_ENABLED: "0"
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          staticcheck ./...
      - name: tela lint
        # The static form of the dev-mode checks (ADR-173): classes, roles,
        # aria tokens, keys and hooks in the repository's own source.
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/tela lint ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  test-linux:
    name: test (linux, headless goldens)
    # Slow job: skipped on pushes to work branches, which run only the fast
    # jobs and macOS; main, pull requests, the weekly run, tags and manual
    # runs run it (ADR-220).
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        env:
          CGO_ENABLED: "0"
        # On a 4-vCPU runner the suite is CPU-bound (about 27 CPU-minutes
        # in 7 minutes on four simulated vCPUs), and examples/dashboard,
        # its largest package, runs through nearly all of it: its 10-minute
        # default timeout measured the whole suite. 20m leaves room.
        run: go test -timeout 20m ./...
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-linux
          path: |
            **/*_actual.png
            **/*_diff.png
          if-no-files-found: ignore

  icons-lucide:
    name: icons/lucide (separate module)
    # icons/lucide has its own go.mod (ADR-102): the root jobs do not build
    # or test it. It builds against the tela next to it (a replace directive).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icons/lucide
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: go build (windows)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: go build ./...
      - name: go build (darwin)
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
        run: go build ./...

  looks:
    name: looks (separate module)
    # looks has its own go.mod (ADR-197): the root jobs do not build or test
    # it. It builds against the tela next to it (a replace directive).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: looks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: go build (windows)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: go build ./...
      - name: go build (darwin)
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
        run: go build ./...

  site-snippets:
    name: site/snippets (separate module)
    # site/snippets has its own go.mod (ADR-207): the root jobs do not build
    # it. The landing page shows these programs and the PNGs that tela
    # snapshot renders from them, so a change to the framework re-checks that
    # the committed PNGs are still what it draws.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/snippets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            site/snippets/go.sum
      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: PNGs are up to date
        run: ../scripts/render-snippets.sh --check

  test-race:
    name: test (race detector, verification only)
    # Slow job: skipped on pushes to work branches, which run only the fast
    # jobs and macOS; main, pull requests, the weekly run, tags and manual
    # runs run it (ADR-220).
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The race detector needs cgo. Nothing is built or shipped with it.
      # -short skips the timing assertions (meaningless under the race
      # detector), and internal/core runs 10x slower than usual, past go
      # test's default 10 minute timeout.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -short -timeout 45m ./internal/core/... . ./internal/platform/...

  test-arm64:
    name: test (linux/arm64, pixel determinism)
    # Slow job: skipped on pushes to work branches, which run only the fast
    # jobs and macOS; main, pull requests, the weekly run, tags and manual
    # runs run it (ADR-220).
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/') || github.ref == 'refs/heads/main'
    # Native arm64 runner (free for public repositories), so no qemu.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -short (arm64)
        env:
          CGO_ENABLED: "0"
        run: go test -short ./internal/fmath/... ./internal/gfx/... ./internal/text/... ./internal/style/... ./internal/layout/...
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-arm64
          path: |
            **/*_actual.png
            **/*_diff.png
          if-no-files-found: ignore

  test-wine:
    name: test (windows under Wine)
    # Slow job: skipped on pushes to work branches, which run only the fast
    # jobs and macOS; main, pull requests, the weekly run, tags and manual
    # runs run it (ADR-220).
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WINEDEBUG: "-all"
      WINEDLLOVERRIDES: "mscoree,mshtml="
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Wine
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y wine64
      - name: Create the Wine prefix with the null graphics driver
        # No window reaches a display; the win32 tests only need the
        # message loop, GDI and the clipboard.
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
        run: |
          wineboot -u
          wine reg add 'HKCU\Software\Wine\Drivers' /v Graphics /d null /f
          # Start the wineserver and Wine's own background processes (the
          # desktop process the first window launches) now, detached from
          # go test's pipes: otherwise they inherit a test binary's output
          # and go test waits for it ("Test I/O incomplete ... WaitDelay
          # expired") after the test passed.
          # wineboot and reg leave a short-lived wineserver behind, and
          # wineserver -p fails while another one runs: wait for it first.
          wineserver -w
          wineserver -p > /dev/null 2>&1 < /dev/null
          wine cmd /c exit > /dev/null 2>&1 < /dev/null
          # A first window starts the desktop process; notepad is killed
          # after it, the desktop process stays with the wineserver.
          timeout 10 wine notepad.exe > /dev/null 2>&1 < /dev/null || true
      - name: go test under Wine
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
        # -short: timing assertions do not hold under Wine. -timeout 20m:
        # examples/dashboard takes about 6 minutes under Wine (364 s on
        # 2026-11-01), too close to go test's 10-minute default.
        run: go test -short -timeout 20m -exec wine ./...
      - name: Stop wineserver
        if: always()
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: wineserver -k || true

  test-windows:
    name: test (windows-latest)
    # Slow job: skipped on pushes to work branches, which run only the fast
    # jobs and macOS; main, pull requests, the weekly run, tags and manual
    # runs run it (ADR-220).
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/') || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test (win32, alone)
        shell: bash
        env:
          CGO_ENABLED: "0"
        # The win32 tests drive real windows on the runner's desktop (focus,
        # keyboard, cursor, DWM). Beside the rest of the suite they share it
        # with other packages' processes, whose console windows can come on
        # top (a console's black was read where a test window was), and the
        # CPU with the heaviest packages: they run first, alone.
        run: go test -timeout 20m ./internal/platform/win32/
      - name: go test (the rest)
        if: success() || failure()
        shell: bash
        env:
          CGO_ENABLED: "0"
        # -timeout 20m: see the linux job.
        run: go test -timeout 20m $(go list ./... | grep -v '/internal/platform/win32$')
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-windows
          path: |
            **/*_actual.png
            **/*_diff.png
          if-no-files-found: ignore

  test-macos:
    name: test (macos-latest)
    # The macOS backend (phase 14) is verified here; the owner has no Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: go test (cocoa, verbose)
        env:
          CGO_ENABLED: "0"
        # -v: the cocoa tests log what ran (capture path, metrics, pixel
        # samples) even when they pass; no Mac is at hand to look.
        run: go test -v -count=1 -timeout 10m ./internal/platform/cocoa/ ./internal/platform/auto/ ./internal/darwin/
      - name: go test (tela dev on a cocoa host, verbose)
        if: success() || failure()
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 -timeout 10m -run 'TestDevEndToEndCocoa' ./cmd/tela/
      - name: go test (all)
        if: success() || failure()
        env:
          CGO_ENABLED: "0"
        # The whole suite on a Mac host: headless goldens, the packages that
        # follow the host's platform flavor (ADR-221) and the cocoa backend.
        # -timeout 25m: see the linux job.
        run: go test -timeout 25m ./...
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-macos
          path: |
            **/*_actual.png
            **/*_diff.png
          if-no-files-found: ignore
