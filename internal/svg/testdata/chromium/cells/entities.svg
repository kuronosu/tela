<svg version="1.1" xmlns="&ns_svg;" xmlns:xlink="&ns_xlink;" xmlns:i="http://ns.adobe.com/AdobeIllustrator/10.0/" width="100px" height="100px" viewBox="0 0 100 100" xml:space="preserve">
  <metadata><i:pgf>ignored</i:pgf></metadata>
  <i:foo><rect width="100" height="100" fill="red"/></i:foo>
  <g i:extraneous="self">
    <rect x="10" y="10" width="80" height="80" rx="10" fill="&brand;"/>
    <title>Title</title><desc>Text is not rendered</desc>
    <circle cx="50" cy="50" r="25" style="fill:#FFFFFF;stroke:#0C4A6E;stroke-width:4;stroke-miterlimit:10;"/>
  </g>
</svg>
