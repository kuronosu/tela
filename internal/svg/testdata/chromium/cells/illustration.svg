    <radialGradient id="sun" cx=".5" cy=".5" r=".5" fx=".4" fy=".35"><stop offset="0" stop-color="#fef9c3"/><stop offset=".7" stop-color="#facc15"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
