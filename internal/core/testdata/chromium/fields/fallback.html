<!doctype html>
<!-- TestChromiumInputFallbackBaselines (field_baseline_test.go): one input
per 50 px row, in the order of inputFallbackCases. Measured by hand with
chromium --headless --hide-scrollbars --force-color-profile=srgb
--force-device-scale-factor=S --window-size=300,700
--allow-file-access-from-files --virtual-time-budget=2000 --screenshot:
the lowest dark device row of the first "H" (columns 12 to 18 CSS px; the
right-to-left row's at 125 to 150) in each row. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; src: url("../../../../assets/fonts/inter/InterVariable.ttf"); font-weight: 100 900; }
@font-face { font-family: "Noto Sans Arabic"; src: url("../../../../assets/fonts/notosansarabic/NotoSansArabic-wdth-wght.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: white; font-family: Inter, "Noto Sans Arabic"; }
.row { height: 50px; width: 300px; }
input { display: block; box-sizing: border-box; border: 0; padding: 4px 12px; width: 240px; font: inherit; font-size: 14px; color: black; background: white; outline: none; }
input::placeholder { color: black; }
.a { height: 36px; line-height: 20px; }
.b { line-height: 20px; }
.c { line-height: 1; }
.s::placeholder { font-size: 10px; }
.l::placeholder { font-size: 20px; }
</style></head>
<body>
<div class="row"><input class="a" value="HHH مرحبا بالعالم"></div>
<div class="row"><input class="b" value="HHH مرحبا بالعالم"></div>
<div class="row"><input class="c" value="HHH مرحبا بالعالم"></div>
<div class="row"><input class="a" dir="rtl" value="مرحبا بالعالم HHH"></div>
<div class="row"><input class="a" placeholder="HHH مرحبا بالعالم"></div>
<div class="row"><input class="c" placeholder="HHH مرحبا بالعالم"></div>
<div class="row"><input class="a s" placeholder="HHH"></div>
<div class="row"><input class="a l" placeholder="HHH"></div>
<div class="row"><input class="c s" placeholder="HHH"></div>
<div class="row"><input class="c l" placeholder="HHH"></div>
<div class="row"><input class="b s" placeholder="HHH"></div>
<div class="row"><input class="b l" placeholder="HHH"></div>
<div class="row"><input class="a" value="HHH"></div>
</body></html>
