<!doctype html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; padding: 0; overflow: hidden; }
body { width: 640px; height: 600px; background: rgb(242.974 244.018 246.105 / 1.000); position: relative; }
div { position: absolute; box-sizing: border-box; }
</style></head><body>
<div title="shadow-2xs" style="left: 30px; top: 30px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 1px 0px 0px rgb(0.000 0.000 0.000 / 0.050);"></div>
<div title="shadow-xs" style="left: 190px; top: 30px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 1px 2px 0px rgb(0.000 0.000 0.000 / 0.050);"></div>
<div title="shadow-sm" style="left: 350px; top: 30px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 1px 3px 0px rgb(0.000 0.000 0.000 / 0.100), 0px 1px 2px -1px rgb(0.000 0.000 0.000 / 0.100);"></div>
<div title="shadow-md" style="left: 510px; top: 30px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 4px 6px -1px rgb(0.000 0.000 0.000 / 0.100), 0px 2px 4px -2px rgb(0.000 0.000 0.000 / 0.100);"></div>
<div title="shadow-lg" style="left: 30px; top: 180px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 10px 15px -3px rgb(0.000 0.000 0.000 / 0.100), 0px 4px 6px -4px rgb(0.000 0.000 0.000 / 0.100);"></div>
<div title="shadow-xl" style="left: 190px; top: 180px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 20px 25px -5px rgb(0.000 0.000 0.000 / 0.100), 0px 8px 10px -6px rgb(0.000 0.000 0.000 / 0.100);"></div>
<div title="shadow-2xl" style="left: 350px; top: 180px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 25px 50px -12px rgb(0.000 0.000 0.000 / 0.250);"></div>
<div title="inset-shadow-2xs" style="left: 510px; top: 180px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: inset 0px 1px 0px 0px rgb(0.000 0.000 0.000 / 0.050);"></div>
<div title="inset-shadow-xs" style="left: 30px; top: 330px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: inset 0px 1px 1px 0px rgb(0.000 0.000 0.000 / 0.050);"></div>
<div title="inset-shadow-sm" style="left: 190px; top: 330px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: inset 0px 2px 4px 0px rgb(0.000 0.000 0.000 / 0.050);"></div>
<div title="shadow-lg-indigo" style="left: 350px; top: 330px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 10px 15px -3px rgb(97.455 94.832 255.000 / 0.500), 0px 4px 6px -4px rgb(97.455 94.832 255.000 / 0.500);"></div>
<div title="negative-spread" style="left: 510px; top: 330px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 18px 16px -10px rgb(0.000 0.000 0.000 / 0.450);"></div>
<div title="inset-strong" style="left: 30px; top: 480px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: inset 4px 6px 12px 2px rgb(0.000 0.000 0.000 / 0.300);"></div>
<div title="rotated" style="left: 190px; top: 480px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 20px 25px -5px rgb(0.000 0.000 0.000 / 0.100), 0px 8px 10px -6px rgb(0.000 0.000 0.000 / 0.100); transform: rotate(12deg);"></div>
<div title="pill" style="left: 350px; top: 500px; width: 100px; height: 30px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 15px 15px 15px 15px / 15px 15px 15px 15px; box-shadow: 0px 4px 6px -1px rgb(0.000 0.000 0.000 / 0.100), 0px 2px 4px -2px rgb(0.000 0.000 0.000 / 0.100);"></div>
<div title="ring" style="left: 510px; top: 480px; width: 100px; height: 70px; background: rgb(255.000 255.000 255.000 / 1.000); border-radius: 12px 12px 12px 12px / 12px 12px 12px 12px; box-shadow: 0px 0px 0px 4px rgb(97.455 94.832 255.000 / 0.500), 0px 4px 6px -1px rgb(0.000 0.000 0.000 / 0.100);"></div>
</body></html>
