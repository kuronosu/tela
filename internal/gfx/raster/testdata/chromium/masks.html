<!doctype html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; padding: 0; overflow: hidden; background: #fff; }
div { position: absolute; box-sizing: border-box; }
</style></head><body>
<div title="alpha linear" style="left: 4px; top: 4px; width: 152px; height: 122px; background: linear-gradient(to bottom, rgb(245.000 158.000 11.000 / 0.350), rgb(16.000 185.000 129.000 / 0.350));"></div>
<div style="left: 10px; top: 10px; width: 140px; height: 110px; mask-image: linear-gradient(to bottom, black, transparent);"><div style="left: 0px; top: 0px; width: 140px; height: 110px; background: linear-gradient(to right, rgb(99.000 102.000 241.000 / 1.000), rgb(244.000 63.000 94.000 / 1.000));"></div><div style="left: 30px; top: 30px; width: 80px; height: 50px; background: rgb(14.000 165.000 233.000 / 0.700);"></div></div>
<div title="luminance" style="left: 164px; top: 4px; width: 152px; height: 122px; background: linear-gradient(to bottom, rgb(245.000 158.000 11.000 / 0.350), rgb(16.000 185.000 129.000 / 0.350));"></div>
<div style="left: 170px; top: 10px; width: 140px; height: 110px; mask-image: linear-gradient(to right, white, rgb(255 0 0), rgb(0 255 0 / 0.50196), black); mask-mode: luminance;"><div style="left: 0px; top: 0px; width: 140px; height: 110px; background: linear-gradient(to right, rgb(99.000 102.000 241.000 / 1.000), rgb(244.000 63.000 94.000 / 1.000));"></div><div style="left: 30px; top: 30px; width: 80px; height: 50px; background: rgb(14.000 165.000 233.000 / 0.700);"></div></div>
<div title="radial" style="left: 324px; top: 4px; width: 152px; height: 122px; background: linear-gradient(to bottom, rgb(245.000 158.000 11.000 / 0.350), rgb(16.000 185.000 129.000 / 0.350));"></div>
<div style="left: 330px; top: 10px; width: 140px; height: 110px; mask-image: radial-gradient(closest-side, black 60%, transparent);"><div style="left: 0px; top: 0px; width: 140px; height: 110px; background: linear-gradient(to right, rgb(99.000 102.000 241.000 / 1.000), rgb(244.000 63.000 94.000 / 1.000));"></div><div style="left: 30px; top: 30px; width: 80px; height: 50px; background: rgb(14.000 165.000 233.000 / 0.700);"></div></div>
<div title="nested" style="left: 4px; top: 134px; width: 152px; height: 122px; background: linear-gradient(to bottom, rgb(245.000 158.000 11.000 / 0.350), rgb(16.000 185.000 129.000 / 0.350));"></div>
<div style="left: 10px; top: 140px; width: 140px; height: 110px; mask-image: linear-gradient(to right, black, transparent); background: linear-gradient(to bottom, rgb(16.000 185.000 129.000 / 1.000), rgb(15.000 23.000 42.000 / 1.000));"><div style="left: 20px; top: 15px; width: 100px; height: 80px; mask-image: radial-gradient(closest-side, black 60%, transparent);"><div style="left: 0px; top: 0px; width: 100px; height: 80px; background: rgb(244.000 63.000 94.000 / 1.000);"></div><div style="left: 40px; top: 0px; width: 20px; height: 80px; background: rgb(255.000 255.000 0.000 / 1.000);"></div></div></div>
<div title="clip+rotate" style="left: 164px; top: 134px; width: 152px; height: 122px; background: linear-gradient(to bottom, rgb(245.000 158.000 11.000 / 0.350), rgb(16.000 185.000 129.000 / 0.350));"></div>
<div style="left: 170px; top: 140px; width: 140px; height: 110px; border-radius: 24px; overflow: hidden;"><div style="left: 0px; top: 0px; width: 140px; height: 110px; transform: rotate(12deg); mask-image: linear-gradient(to bottom, black, transparent);"><div style="left: 0px; top: 0px; width: 140px; height: 110px; background: linear-gradient(to right, rgb(99.000 102.000 241.000 / 1.000), rgb(244.000 63.000 94.000 / 1.000));"></div><div style="left: 30px; top: 30px; width: 80px; height: 50px; background: rgb(14.000 165.000 233.000 / 0.700);"></div></div></div>
<div title="opacity+multiply" style="left: 324px; top: 134px; width: 152px; height: 122px; background: linear-gradient(to bottom, rgb(245.000 158.000 11.000 / 0.350), rgb(16.000 185.000 129.000 / 0.350));"></div>
<div style="left: 330px; top: 180px; width: 140px; height: 30px; background: rgb(14.000 165.000 233.000 / 1.000);"></div><div style="left: 330px; top: 140px; width: 140px; height: 110px; mask-image: radial-gradient(closest-side, black 60%, transparent); opacity: 0.7; mix-blend-mode: multiply;"><div style="left: 0px; top: 0px; width: 140px; height: 110px; background: linear-gradient(to right, rgb(99.000 102.000 241.000 / 1.000), rgb(244.000 63.000 94.000 / 1.000));"></div><div style="left: 30px; top: 30px; width: 80px; height: 50px; background: rgb(14.000 165.000 233.000 / 0.700);"></div></div>
</body></html>
