<!DOCTYPE html>
<html lang="en">
<head>
  <title>Absolutely positioned boxes are placed against their nearest positioned ancestor, through static blocks; static boxes ignore their insets</title>
</head>
<body>

<div id="test-root" style="position: relative; display: block; width: 300px; height: 200px; border-width: 2px; padding: 4px;">
  <div style="position: static; display: block; padding: 3px; margin-left: 10px;">
    <div style="position: static; display: block; margin: 30px 0 0 40px; width: 50px; height: 50px; top: 1000px; left: 1000px;">
      <div style="position: absolute; top: 5px; right: 7px; width: 20px; height: 10px;"></div>
      <div style="position: absolute; width: 4px; height: 4px;"></div>
      <div style="position: absolute; bottom: 10%; left: 25%; width: 10%; height: 10%;"></div>
    </div>
  </div>
</div>

</body>
</html>
