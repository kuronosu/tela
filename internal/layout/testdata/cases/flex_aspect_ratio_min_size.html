<!DOCTYPE html>
<html lang="en">
<head>
  <title>Flex items with an aspect ratio: a cross size transferred from the item's own main size is not definite, so items with a percentage or px main size shrink (their automatic minimum is the content's, clamped by the transferred min and max), a stretched cross size of an indefinite container is not used to measure them, and their cross size follows the used main size (ADR-157)</title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px;">
  <div style="display: flex; width: 280px;">
    <div style="width: 100%; aspect-ratio: 1;"></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
  </div>
  <div style="display: flex; width: 280px;">
    <div style="width: 280px; aspect-ratio: 1;"></div>
    <div style="width: 280px; aspect-ratio: 1;"></div>
  </div>
  <div style="display: flex; width: 280px;">
    <div style="width: 100%; aspect-ratio: 1; min-width: 50px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-width: 50px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-width: 50px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-width: 50px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-width: 50px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-width: 50px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-width: 50px;"></div>
  </div>
  <div style="display: flex; width: 280px;">
    <div style="width: 100%; aspect-ratio: 1; min-height: 60px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-height: 60px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-height: 60px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-height: 60px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-height: 60px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-height: 60px;"></div>
    <div style="width: 100%; aspect-ratio: 1; min-height: 60px;"></div>
  </div>
  <div style="display: flex; width: 280px;">
    <div style="width: 100%; aspect-ratio: 1; min-height: 60px;"></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
  </div>
  <div style="display: flex; width: 280px;">
    <div style="width: 100%; aspect-ratio: 1;"><div style="display: block; width: 60px; height: 5px;"></div></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
  </div>
  <div style="display: flex; width: 280px; height: 50px;">
    <div style="width: 100%; aspect-ratio: 1;"></div>
    <div style="width: 100%; aspect-ratio: 1;"></div>
  </div>
  <div style="display: flex; width: 280px;">
    <div style="width: 100%; height: 100px; aspect-ratio: 1;"></div>
    <div style="width: 100%; height: 100px; aspect-ratio: 1;"></div>
  </div>
  <div style="display: flex; width: 280px;">
    <div style="width: 100px; max-width: 50px; aspect-ratio: 1;"></div>
  </div>
  <div style="display: flex; flex-direction: column; width: 300px; height: 280px;">
    <div style="height: 100%; aspect-ratio: 1;"></div>
    <div style="height: 100%; aspect-ratio: 1;"></div>
    <div style="height: 100%; aspect-ratio: 1;"></div>
  </div>
  <div style="display: block; width: 300px; height: 120px;">
    <div style="position: absolute; left: 0px; top: 0px; display: flex; width: 300px;">
      <div style="aspect-ratio: 1;"></div>
    </div>
    <div style="position: absolute; left: 0px; top: 10px; display: flex; width: 300px;">
      <div style="width: 100%; aspect-ratio: 1;"></div>
      <div style="width: 100%; aspect-ratio: 1;"></div>
      <div style="width: 100%; aspect-ratio: 1;"></div>
    </div>
    <div style="position: absolute; left: 0px; top: 0px; display: flex; flex-direction: column; height: 100px;">
      <div style="aspect-ratio: 1;"></div>
    </div>
  </div>
  <div style="display: flex; width: 300px;">
    <div style="aspect-ratio: 2;"><div style="display: block; width: 30px; height: 5px;"></div></div>
  </div>
</div>

</body>
</html>
