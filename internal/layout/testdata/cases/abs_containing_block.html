<!DOCTYPE html>
<html lang="en">
<head>
  <title>overflow: hidden does not make a containing block; an absolutely positioned box is one for its own absolutely positioned descendants</title>
</head>
<body>

<div id="test-root" style="position: relative; display: block; width: 400px; height: 300px; border-width: 1px;">
  <div style="position: static; display: block; overflow: hidden; width: 50px; height: 50px; margin: 20px;">
    <div style="position: absolute; right: 0; bottom: 0; width: 10px; height: 10px;"></div>
  </div>
  <div style="position: absolute; top: 10%; left: 10%; right: 10%; bottom: 10%; display: block; padding: 5px;">
    <div style="position: static; display: block; height: 20px;"></div>
    <div style="position: absolute; top: 50%; left: 50%; width: 25%; height: 25%;"></div>
    <div style="position: absolute; width: 10px; height: 10px;"></div>
    <div style="position: static; display: block; padding-left: 7px;">
      <div style="position: absolute; bottom: 0; width: 10px; height: 10px;"></div>
    </div>
  </div>
</div>

</body>
</html>
