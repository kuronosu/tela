<!DOCTYPE html>
<html lang="en">
<head>
  <title>Absolutely positioned children of grids: a static grid gives them a static position in its content box aligned by justify-self/align-self (laid out by the positioned ancestor); a positioned grid is their containing block through their grid area, named or numbered, with auto lines at the padding edges; RTL</title>
</head>
<body>

<div id="test-root" style="position: relative; display: block; width: 360px; padding: 10px;">
  <div style="position: static; display: grid; grid-template-columns: 40px 40px; grid-auto-rows: 20px; width: 150px; height: 70px; padding: 6px 4px; justify-items: center; align-items: end;">
    <div style="position: absolute; width: 10px; height: 10px;"></div>
    <div style="position: absolute; width: 12px; height: 8px; justify-self: end; align-self: start; grid-column: 2;"></div>
    <div></div>
    <div style="position: absolute; width: 14px; height: 6px; justify-self: stretch; align-self: center;"></div>
  </div>
  <div style="position: static; direction: rtl; display: grid; grid-template-columns: 40px; width: 120px; height: 30px; padding-right: 9px;">
    <div style="position: absolute; width: 10px; height: 10px;"></div>
    <div style="position: absolute; width: 10px; height: 10px; justify-self: end;"></div>
  </div>
  <div style="position: relative; display: grid; grid-template-areas: 'a b' 'c c'; grid-template-columns: 50px 70px; grid-template-rows: 20px 30px; width: 200px; height: 80px; padding: 5px; border: 2px solid; gap: 4px;">
    <div style="position: absolute; grid-area: b; top: 2px; right: 3px; bottom: 4px; left: 5px;"></div>
    <div style="position: absolute; grid-area: c; width: 20px; height: 10px; justify-self: center; align-self: end;"></div>
    <div style="position: absolute; grid-column: 2 / auto; grid-row: auto / 2; left: 0; right: 0; top: 0; bottom: 0;"></div>
    <div style="position: absolute; grid-column: a-end; width: 50%; height: 50%;"></div>
    <div style="position: absolute; grid-column: 1 / 7; grid-row: 2; left: 1px; right: 1px; height: 6px;"></div>
  </div>
  <div style="position: relative; direction: rtl; display: grid; grid-template-columns: 50px 70px; grid-auto-rows: 20px; width: 200px; padding: 5px;">
    <div style="position: absolute; grid-column: 1; left: 0; right: 0; top: 0; height: 5px;"></div>
    <div style="position: absolute; grid-column: 2 / 3; width: 10px; height: 10px;"></div>
    <div style="position: absolute; grid-column: auto / 2; left: 2px; right: 2px; height: 10px;"></div>
    <div></div>
  </div>
</div>

</body>
</html>
