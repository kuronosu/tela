<!DOCTYPE html>
<html lang="en">
<head>
  <title>The order property reorders flex items, ties in document order, across wrapped lines</title>
</head>
<body>

<div id="test-root" style="display: flex; flex-wrap: wrap; width: 100px; gap: 5px;">
  <div style="order: 2; width: 30px; height: 10px;"></div>
  <div style="order: -1; width: 30px; height: 20px;"></div>
  <div style="width: 30px; height: 10px;"></div>
  <div style="order: 2; width: 30px; height: 15px;"></div>
  <div style="order: 1; width: 50px; height: 10px;"></div>
  <div style="order: 1; position: absolute; width: 5px; height: 5px;"></div>
</div>

</body>
</html>
