<!DOCTYPE html>
<html lang="en">
<head>
  <title>Static boxes ignore their insets; relative boxes are offset by them, in block and flex layout; display: none takes no space</title>
</head>
<body>

<div id="test-root" style="display: block; width: 200px;">
  <div style="position: static; display: block; top: 10px; left: 20px; height: 10px;"></div>
  <div style="position: relative; display: block; top: 10px; left: 20px; height: 10px;"></div>
  <div style="position: relative; display: block; bottom: 5px; right: 5px; height: 10px;"></div>
  <div style="display: flex; width: 200px; align-items: flex-start;">
    <div style="display: none; width: 50px; height: 50px;"></div>
    <div style="width: 50px; height: 20px; position: relative; left: 10px; top: 5px;"></div>
    <div style="width: 50px; height: 20px; position: static; left: 10px; top: 5px;"></div>
    <div style="width: 50px; height: 30px; position: relative; right: 10%; bottom: 10%;"></div>
  </div>
</div>

</body>
</html>
