<!DOCTYPE html>
<html lang="en">
<head>
  <title>Grid items: a percentage min size of an indefinite grid area counts as 0 (its length part for a calc()), not as auto, in the minimum contribution, so the item shrinks with its track as in flex (CSS Sizing 3 section 5.2.1, ADR-157, ADR-268)</title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px;">
  <div style="display: grid; grid-template-columns: auto; width: 50px;">
    <div style="display: block; min-width: 50%;"><div style="display: block; width: 100px; height: 10px;"></div></div>
  </div>
  <div style="display: grid; grid-template-columns: auto; width: 50px;">
    <div style="display: block;"><div style="display: block; width: 100px; height: 10px;"></div></div>
  </div>
  <div style="display: grid; grid-template-columns: auto; width: 50px;">
    <div style="display: block; min-width: calc(50% + 10px);"><div style="display: block; width: 100px; height: 10px;"></div></div>
  </div>
  <div style="display: grid; grid-template-columns: auto; width: 50px;">
    <div style="display: block; min-width: calc(10% + 70px);"><div style="display: block; width: 100px; height: 10px;"></div></div>
  </div>
  <div style="display: grid; grid-template-rows: auto; height: 50px; width: 100px;">
    <div style="display: block; min-height: 50%;"><div style="display: block; width: 10px; height: 100px;"></div></div>
  </div>
  <div style="display: grid; grid-template-rows: auto; height: 50px; width: 100px;">
    <div style="display: block;"><div style="display: block; width: 10px; height: 100px;"></div></div>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; width: 100px;">
    <div style="display: block; min-width: 50%;"><div style="display: block; width: 100px; height: 10px;"></div></div>
    <div style="display: block;"></div>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; width: 100px;">
    <div style="display: block;"><div style="display: block; width: 100px; height: 10px;"></div></div>
    <div style="display: block;"></div>
  </div>
  <div style="display: grid; grid-template-columns: auto auto; width: fit-content;">
    <div style="display: block; min-width: 50%; width: 10px; height: 10px;"></div>
    <div style="display: block; width: 30px; height: 10px;"></div>
  </div>
  <div style="display: grid; grid-template-columns: auto; width: 50px;">
    <div style="min-width: 50%;"><div style="display: block; width: 100px; height: 10px; flex-shrink: 0;"></div></div>
  </div>
  <div style="display: grid; grid-template-columns: minmax(auto, 20px); width: 50px;">
    <div style="display: block; min-width: 50%;"><div style="display: block; width: 100px; height: 10px;"></div></div>
  </div>
</div>

</body>
</html>
