<!DOCTYPE html>
<html lang="en">
<head>
  <title>A zero percentage of an indefinite basis is indefinite like any percentage: flex-basis 0% (flex: 1 1 0%) and calc(0% + 10px) are content-based in a column of auto height, height 0% is auto, max-height 0% is none, top 0% is auto, a 0% grid track is auto; min-height 0%, 50% and calc(50% + 10px) count as 0 and 10px, not as auto (ADR-157)</title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px;">
  <div style="display: flex; flex-direction: column; max-height: 300px; width: 200px;">
    <div style="flex: 1 1 0%; overflow-y: auto; padding: 4px;"><div style="display: block; height: 80px;"></div></div>
  </div>
  <div style="display: flex; flex-direction: column; max-height: 300px; width: 200px;">
    <div style="flex-grow: 1; flex-basis: 0px; overflow-y: auto; padding: 4px;"><div style="display: block; height: 80px;"></div></div>
  </div>
  <div style="display: flex; flex-direction: column; max-height: 300px; width: 200px;">
    <div style="flex-grow: 1; flex-basis: calc(0% + 10px); overflow-y: auto; padding: 4px;"><div style="display: block; height: 80px;"></div></div>
  </div>
  <div style="display: block; width: 100px;">
    <div style="display: block; height: 0%;"><div style="display: block; height: 30px;"></div></div>
  </div>
  <div style="display: block; width: 100px;">
    <div style="display: block; max-height: 0%;"><div style="display: block; height: 30px;"></div></div>
  </div>
  <div style="display: block; width: 100px;">
    <div style="display: block; position: relative; top: 0%; bottom: 10px; height: 20px;"></div>
  </div>
  <div style="display: flex; flex-direction: column; max-height: 50px; width: 100px;">
    <div style="display: block; min-height: 0%;"><div style="display: block; height: 100px;"></div></div>
  </div>
  <div style="display: flex; flex-direction: column; max-height: 50px; width: 100px;">
    <div style="display: block; min-height: 50%;"><div style="display: block; height: 100px;"></div></div>
  </div>
  <div style="display: flex; flex-direction: column; max-height: 50px; width: 100px;">
    <div style="display: block; min-height: calc(50% + 10px);"><div style="display: block; height: 100px;"></div></div>
  </div>
  <div style="display: grid; grid-template-rows: 0% auto; width: 100px;">
    <div style="display: block; height: 30px;"></div>
    <div style="display: block; height: 20px;"></div>
  </div>
  <div style="display: block; width: 100px;">
    <div style="display: grid; grid-template-columns: 0% auto; width: fit-content;">
      <div style="display: block; width: 30px; height: 5px;"></div>
      <div style="display: block; width: 20px; height: 5px;"></div>
    </div>
  </div>
  <div style="display: block; width: fit-content;">
    <div style="display: block; width: 0%;"><div style="display: block; width: 50px; height: 10px;"></div></div>
  </div>
</div>

</body>
</html>
