<!DOCTYPE html>
<html lang="en">
<head>
  <title>In right-to-left blocks, the static position of an absolutely positioned box is at the inline end; relative right insets apply</title>
</head>
<body>

<div id="test-root" style="position: relative; display: block; width: 200px; height: 100px; direction: rtl;">
  <div style="position: static; display: block; direction: rtl; padding: 0 10px 0 30px;">
    <div style="direction: rtl; display: block; width: 50px; height: 10px;"></div>
    <div style="position: absolute; direction: rtl; width: 20px; height: 20px;"></div>
    <div style="position: relative; direction: rtl; display: block; width: 40px; height: 10px; right: 5px;"></div>
  </div>
</div>

</body>
</html>
