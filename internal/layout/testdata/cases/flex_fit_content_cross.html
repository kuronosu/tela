<!DOCTYPE html>
<html lang="en">
<head>
  <title>A flex item with a min-content, max-content or fit-content cross size is measured at that size, not stretched: a fit-content box of aspect-ratio cells in a stretching column is as tall as in a block (kit's Calendar), and so is an item with auto cross margins (ADR-157)</title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px;">
  <div style="display: flex; flex-direction: column; width: 400px;">
    <div style="display: block; width: fit-content; padding: 12px;">
      <div style="display: flex;"><div style="width: 32px;"></div><div style="width: 32px;"></div></div>
      <div style="display: flex;">
        <div style="display: block; flex: 1 1 0%;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
        <div style="display: block; flex: 1 1 0%;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
      </div>
    </div>
    <div style="display: block; width: min-content; padding: 12px;">
      <div style="display: flex;"><div style="width: 32px;"></div><div style="width: 32px;"></div></div>
      <div style="display: flex;">
        <div style="display: block; flex: 1 1 0%;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
        <div style="display: block; flex: 1 1 0%;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
      </div>
    </div>
    <div style="display: block; width: max-content; padding: 12px;">
      <div style="display: flex;"><div style="width: 32px;"></div><div style="width: 32px;"></div></div>
      <div style="display: flex;">
        <div style="display: block; flex: 1 1 0%;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
        <div style="display: block; flex: 1 1 0%;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
      </div>
    </div>
    <div style="display: block; margin: 0px auto;">
      <div style="display: flex;"><div style="width: 30px;"></div><div style="width: 30px;"></div></div>
      <div style="display: flex;">
        <div style="display: block; flex: 1 1 0%;"><div style="display: block; width: 100%; aspect-ratio: 1;"></div></div>
      </div>
    </div>
    <div style="display: block; width: fit-content; padding: 12px;">
      <div style="display: flex;">
        <div style="display: block; flex: 1 1 0%; height: 100%; width: 100%; aspect-ratio: 1;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
        <div style="display: block; flex: 1 1 0%; height: 100%; width: 100%; aspect-ratio: 1;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
        <div style="display: block; flex: 1 1 0%; height: 100%; width: 100%; aspect-ratio: 1;"><div style="display: block; width: 100%; aspect-ratio: 1; min-width: 32px;"></div></div>
      </div>
    </div>
  </div>
  <div style="display: flex; width: 400px; height: 100px;">
    <div style="display: block; width: 40px; height: fit-content;"><div style="display: block; height: 20px;"></div></div>
    <div style="display: block; width: 40px; height: min-content;"><div style="display: block; height: 30px;"></div></div>
  </div>
</div>

</body>
</html>
