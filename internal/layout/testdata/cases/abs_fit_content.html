<!DOCTYPE html>
<html lang="en">
<head>
  <title>Absolutely positioned boxes with an auto width are fit-content sized: their max-content width, limited by the containing block</title>
</head>
<body>

<div id="test-root" style="position: relative; display: block; width: 300px; height: 300px;">
  <div style="position: absolute; left: 10px; top: 0; display: flex;">
    <div style="width: 200px; max-width: 100px; height: 10px;"></div>
    <div style="flex-basis: 0; flex-grow: 1;">HH&ZeroWidthSpace;HH</div>
  </div>
  <div style="position: absolute; left: 50px; top: 50px; display: flex; flex-direction: column;">
    <div>HHHHHHHHHH&ZeroWidthSpace;HHHHHHHHHH&ZeroWidthSpace;HHHHHHHHHH</div>
  </div>
  <div style="position: absolute; right: 0; top: 100px; display: block;">
    <div style="display: block;">HHHH&ZeroWidthSpace;HHHH</div>
  </div>
  <div style="position: absolute; left: 0; top: 150px; display: flex; flex-wrap: wrap; max-width: 120px;">
    <div style="width: 50px; height: 10px;"></div>
    <div style="width: 50px; height: 10px;"></div>
    <div style="width: 50px; height: 10px;"></div>
  </div>
</div>

</body>
</html>
