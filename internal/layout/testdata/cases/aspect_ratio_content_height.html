<!DOCTYPE html>
<html lang="en">
<head>
  <title>Boxes with an aspect ratio and a height transferred from their width: while min-height is auto and the box is not a scroll container, the height is at least the content's, capped by the max height (css-sizing-4 section 5.2's automatic minimum size; ADR-268)</title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px;">
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 1;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 1; min-height: 0px;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 1; overflow: hidden;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 1; max-height: 40px;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 1; max-width: 20px;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 1; padding: 5px;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 1;"><div style="display: block; width: 5px; height: 10px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; width: 20px; aspect-ratio: 1;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: flex; aspect-ratio: 1;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: flex; aspect-ratio: 1;"><div style="display: block; width: 5px; height: 5px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: flex; aspect-ratio: 1; min-height: 0px;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: grid; aspect-ratio: 1;"><div style="display: block; width: 5px; height: 60px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: grid; aspect-ratio: 1;"><div style="display: block; width: 5px; height: 5px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 2;">XX&#8203;XX&#8203;XX&#8203;XX</div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: block; aspect-ratio: 1;"><div style="display: block; width: 5px; height: 50%;"></div><div style="display: block; width: 5px; height: 40px;"></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: flex; aspect-ratio: 2;"><div style="display: block; width: 10px; height: 100%;"><div style="display: block; width: 5px; height: 60px;"></div></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: flex; flex-direction: column; aspect-ratio: 2;"><div style="display: block; width: 10px; height: 100%;"><div style="display: block; width: 5px; height: 60px;"></div></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: grid; aspect-ratio: 2;"><div style="display: block; width: 10px; height: 100%;"><div style="display: block; width: 5px; height: 60px;"></div></div></div>
  </div>
  <div style="display: block; width: 30px;">
    <div style="display: flex; flex-direction: column; aspect-ratio: 1;"><div style="display: block; height: 20px;"></div><div style="display: block; height: 30px; flex-grow: 1;"></div></div>
  </div>
</div>

</body>
</html>
