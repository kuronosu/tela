  - radio "٠"
  - radio "١"
  - radio "٢"
  - radio "٣" [checked]
  - radio "١١"
  - radio "١٠٠"
- text: plural "messages" ٣ رسائل جديدة plural "items" ٣ عناصر في سلتك selectordinal "rank" ترتيبك ٣ في الطابور the plural category few
- heading "Formatting" [level=3]
- paragraph: i18n.UseFormatter gives numbers, percentages, dates, times and lists the way the language writes them, digits included.
- text: f.Number(1234.5, MinFractionDigits(2)) ١٬٢٣٤٫٥٠ f.Number(0.15, Percent()) ١٥٪؜ f.Date(t, Full) السبت، ١٤ مارس ٢٠٢٦ f.Time(t, Short) ٣:٣٠ م f.List(items) تفاح وكمثرى وتين
- heading "kit follows the language" [level=3]
- paragraph: A DatePicker writes the date, names the months and weekdays, starts the week and lays the calendar out the way the language does. What kit defaults to English comes from the catalog (kit.* keys); Arabic's short weekday names do not fit a cell, so it asks for the narrow ones.
- group:
  - text: تاريخ التوصيل
  - button "تاريخ التوصيل": اختر تاريخًا
  - paragraph: لا نوصل أيام الأحد.
- heading "Tela's own texts" [level=3]
- paragraph: "The texts Tela draws itself have an ID and an English default (tela.Labels lists them): a catalog message with that key translates it, so the title bar, the message boxes, the toasts and the role items of a menu follow the language. Tela ships no translations; an app adds the messages, as locales/*.json does here."
- text: f.Label("tela.toast.region") الإشعارات f.Label("tela.toast.close") إغلاق الإشعار f.Label("tela.titlebar.close") إغلاق f.Label("tela.menu.copy") نسخ f.Label("tela.menu.quit", "name", "Notes") إنهاء Notes f.Label("tela.messagebox.question") سؤال
- button "إظهار مربع رسالة"
- heading "Digits of a locale" [level=3]
- paragraph: "Numbers and dates use the numbering system CLDR gives the locale by region, script and language: ar-EG writes Arabic-Indic digits, ar-AE and ar-MA Latin ones. A -u-nu- extension in the tag wins."
