- heading "Internationalization" [level=1]
- paragraph: Messages, plurals and formats in English, Spanish and Arabic. The Language menu in the header switches the whole window, and its direction.
- text: i18n
- heading "Messages" [level=3]
- paragraph: "Arguments in {braces}, numbers formatted for the language, and nested keys written with a dot: t(\"summary.updated\")."
- text: t("greeting", "name", "Ana") Hello, Ana! t("step", "step", 3, "total", 4) Step 3 of 4 t("summary.discount") Discount t("summary.updated") Updated
- heading "Plurals" [level=3]
- paragraph: "The language's own rules choose the form: English has one and other, Arabic zero, one, two, few, many and other. Count to see them change."
- button "Remove one"
- text: "3"
- button "Add one"
- radiogroup "Count":
  - radio "0"
  - radio "1"
  - radio "2"
  - radio "3" [checked]
  - radio "11"
  - radio "100"
- text: plural "messages" 3 new messages plural "items" 3 items in your cart selectordinal "rank" You are 3rd in line the plural category other
- heading "Formatting" [level=3]
- paragraph: i18n.UseFormatter gives numbers, percentages, dates, times and lists the way the language writes them, digits included.
- text: f.Number(1234.5, MinFractionDigits(2)) 1,234.50 f.Number(0.15, Percent()) 15% f.Date(t, Full) Saturday, March 14, 2026 f.Time(t, Short) 3:30 PM f.List(items) apples, pears, and figs
- heading "kit follows the language" [level=3]
- paragraph: A DatePicker writes the date, names the months and weekdays, starts the week and lays the calendar out the way the language does. What kit defaults to English comes from the catalog (kit.* keys); Arabic's short weekday names do not fit a cell, so it asks for the narrow ones.
- group:
  - text: Delivery date
  - button "Delivery date" [expanded]: Pick a date
  - paragraph: We do not deliver on Sundays.
- heading "Tela's own texts" [level=3]
- paragraph: "The texts Tela draws itself have an ID and an English default (tela.Labels lists them): a catalog message with that key translates it, so the title bar, the message boxes, the toasts and the role items of a menu follow the language. Tela ships no translations; an app adds the messages, as locales/*.json does here."
- text: f.Label("tela.toast.region") Notifications f.Label("tela.toast.close") Close toast f.Label("tela.titlebar.close") Close f.Label("tela.menu.copy") Copy f.Label("tela.menu.quit", "name", "Notes") Quit Notes f.Label("tela.messagebox.question") Question
- button "Show a message box"
- heading "Digits of a locale" [level=3]
- paragraph: "Numbers and dates use the numbering system CLDR gives the locale by region, script and language: ar-EG and ar-SA write Arabic-Indic digits, a bare ar, ar-AE and ar-MA Latin ones (CLDR 48). A -u-nu- extension in the tag wins."
- text: ar 1,234.50 · 14‏/03‏/2026 ar-EG ١٬٢٣٤٫٥٠ · ١٤‏/٠٣‏/٢٠٢٦ ar-EG-u-nu-latn 1,234.50 · 14‏/03‏/2026 ar-AE 1,234.50 · 14‏/03‏/2026 es 1.234,50 · 14 mar 2026
