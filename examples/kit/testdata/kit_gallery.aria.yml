- tabpanel "Button":
  - heading "Button" [level=1]
  - paragraph: A button in six variants and eight sizes, with icon slots. It is the trigger of every overlay.
  - text: kit.Button
  - heading "Variants" [level=3]
  - paragraph: Default, Secondary, Outline, Ghost, Destructive and Link.
  - button "Button"
  - button "Secondary"
  - button "Outline"
  - button "Ghost"
  - button "Destructive"
  - button "Link"
