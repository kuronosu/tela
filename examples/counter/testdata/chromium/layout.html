<!doctype html>
<html class="h-full">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="counter.css">
</head>
<body class="h-full">
<style>html { overflow: hidden; } html, body { height: 600px; }</style>
<div class="flex items-center justify-center h-full bg-stone-200"><div class="flex flex-col items-center gap-6 w-80 p-10 rounded-2xl bg-stone-50 border border-stone-300 shadow-xl text-stone-800"><span class="text-sm font-medium tracking-widest text-stone-500">COUNT</span><h1 class="text-8xl font-bold tracking-tight tabular-nums">0</h1><button class="w-full py-3 rounded-xl bg-stone-800 text-stone-100 font-medium hover:bg-stone-700 active:scale-95 transition">Increment</button></div></div>
<pre id="out" hidden></pre>
<script>
document.fonts.ready.then(() => Promise.all([...document.fonts].map(f => f.load()))).then(() => {
  const rect = r => [r.left, r.top, r.width, r.height];
  const outer = document.querySelector("div");
  const card = outer.firstElementChild;
  const span = document.querySelector("span");
  const h1 = document.querySelector("h1");
  const button = document.querySelector("button");
  // Blink quantizes the font metrics in device pixels: measure at the
  // device size.
  const dpr = window.devicePixelRatio;
  const ctx = document.createElement("canvas").getContext("2d");
  const textOf = el => {
    const range = document.createRange();
    range.selectNodeContents(el);
    const cs = getComputedStyle(el);
    ctx.font = cs.fontWeight + " " + (parseFloat(cs.fontSize) * dpr) + "px " + cs.fontFamily;
    const m = ctx.measureText(el.textContent);
    return {rect: rect(range.getBoundingClientRect()), ascent: m.fontBoundingBoxAscent / dpr};
  };
  const label = textOf(span), text = textOf(h1), buttonText = textOf(button);
  document.getElementById("out").textContent = "BEGIN" + JSON.stringify({
    dpr: dpr,
    outer: rect(outer.getBoundingClientRect()),
    card: rect(card.getBoundingClientRect()),
    span: rect(span.getBoundingClientRect()),
    spanText: label.rect,
    spanAscent: label.ascent,
    h1: rect(h1.getBoundingClientRect()),
    text: text.rect,
    ascent: text.ascent,
    button: rect(button.getBoundingClientRect()),
    buttonText: buttonText.rect,
    buttonAscent: buttonText.ascent,
  }) + "END";
});
</script>
</body>
</html>
