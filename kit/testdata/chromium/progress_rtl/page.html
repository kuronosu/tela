<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="gallery.css">
</head>
<body class="bg-white">
<div data-probe="page" class="w-[800px]">
<div data-probe="panel" dir="rtl" class="flex flex-wrap items-start gap-6 bg-background p-6 text-foreground">
<div class="flex-none w-[320px]">
<div data-probe="zero" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="0" aria-valuetext="0%" data-state="loading" data-value="0" data-max="100" data-slot="progress" data-probe="zero-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="loading" data-value="0" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(100%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="quarter" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="25" aria-valuetext="25%" data-state="loading" data-value="25" data-max="100" data-slot="progress" data-probe="quarter-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="loading" data-value="25" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(75%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="two-thirds" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="66" aria-valuetext="66%" data-state="loading" data-value="66" data-max="100" data-slot="progress" data-probe="two-thirds-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="loading" data-value="66" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(34%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="done" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="100" aria-valuetext="100%" data-state="complete" data-value="100" data-max="100" data-slot="progress" data-probe="done-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="complete" data-value="100" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(0%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="tall" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="40" aria-valuetext="40%" data-state="loading" data-value="40" data-max="100" data-slot="progress" data-probe="tall-bar" class="relative w-full overflow-hidden rounded-full bg-primary/20 h-4"><div data-state="loading" data-value="40" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(60%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="indicator-class" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="70" aria-valuetext="70%" data-state="loading" data-value="70" data-max="100" data-slot="progress" data-probe="indicator-class-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="loading" data-value="70" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 transition-all bg-emerald-500" style="transform: translateX(30%);"></div></div>
</div>
</div>
</div>
<div data-probe="panel" dir="rtl" class="dark flex flex-wrap items-start gap-6 bg-background p-6 text-foreground">
<div class="flex-none w-[320px]">
<div data-probe="zero" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="0" aria-valuetext="0%" data-state="loading" data-value="0" data-max="100" data-slot="progress" data-probe="zero-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="loading" data-value="0" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(100%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="quarter" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="25" aria-valuetext="25%" data-state="loading" data-value="25" data-max="100" data-slot="progress" data-probe="quarter-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="loading" data-value="25" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(75%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="two-thirds" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="66" aria-valuetext="66%" data-state="loading" data-value="66" data-max="100" data-slot="progress" data-probe="two-thirds-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="loading" data-value="66" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(34%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="done" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="100" aria-valuetext="100%" data-state="complete" data-value="100" data-max="100" data-slot="progress" data-probe="done-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="complete" data-value="100" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(0%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="tall" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="40" aria-valuetext="40%" data-state="loading" data-value="40" data-max="100" data-slot="progress" data-probe="tall-bar" class="relative w-full overflow-hidden rounded-full bg-primary/20 h-4"><div data-state="loading" data-value="40" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(60%);"></div></div>
</div>
</div>
<div class="flex-none w-[320px]">
<div data-probe="indicator-class" class="flex w-[300px]">
<div role="progressbar" aria-valuemax="100" aria-valuemin="0" aria-valuenow="70" aria-valuetext="70%" data-state="loading" data-value="70" data-max="100" data-slot="progress" data-probe="indicator-class-bar" class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-state="loading" data-value="70" data-max="100" data-slot="progress-indicator" class="h-full w-full flex-1 transition-all bg-emerald-500" style="transform: translateX(30%);"></div></div>
</div>
</div>
</div>
</div>
<pre id="out" style="display: none"></pre>
<script>
document.fonts.ready.then(() => Promise.all([...document.fonts].map(f => f.load()))).then(() => {
  const out = [];
  for (const e of document.querySelectorAll("[data-probe]")) {
    const r = e.getBoundingClientRect();
    out.push([e.dataset.probe, r.left + scrollX, r.top + scrollY, r.width, r.height]);
  }
  document.getElementById("out").textContent = "BEGIN" + JSON.stringify(out) + "END";
});
</script>
</body>
</html>
