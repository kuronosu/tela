<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="gallery.css">
</head>
<body class="bg-white">
<div data-probe="page" class="w-[800px]">
<div data-probe="panel" class="flex flex-wrap items-start gap-6 bg-background p-6 text-foreground">
<div class="flex-none w-[280px]">
<div data-probe="area-indigo" class="flex">
<div class="relative h-40 shrink-0 cursor-crosshair rounded-md shadow-xs select-none w-64" style="background-color: rgb(0 5 255 / 1)"><div class="pointer-events-none absolute inset-0 rounded-md bg-linear-to-r from-white to-transparent"></div><div class="pointer-events-none absolute inset-0 rounded-md bg-linear-to-t from-black to-transparent ring-1 ring-black/10 ring-inset dark:ring-white/10"></div></div>
</div>
</div>
<div class="flex-none w-[280px]">
<div data-probe="area-amber" class="flex">
<div class="relative h-40 shrink-0 cursor-crosshair rounded-md shadow-xs select-none w-64" style="background-color: rgb(255 160 0 / 1)"><div class="pointer-events-none absolute inset-0 rounded-md bg-linear-to-r from-white to-transparent"></div><div class="pointer-events-none absolute inset-0 rounded-md bg-linear-to-t from-black to-transparent ring-1 ring-black/10 ring-inset dark:ring-white/10"></div></div>
</div>
</div>
<div class="flex-none w-[280px]">
<div data-probe="hue-track" class="flex">
<div class="relative h-3 grow cursor-pointer rounded-full shadow-xs w-64" style="background-image: linear-gradient(to right in srgb, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00)"></div>
</div>
</div>
<div class="flex-none w-[280px]">
<div data-probe="alpha-indigo" class="flex">
<div class="bg-white bg-[conic-gradient(#d4d4d4_25%,#fff_0_50%,#d4d4d4_0_75%,#fff_0)] bg-[length:12px_12px] dark:bg-neutral-900 dark:bg-[conic-gradient(#404040_25%,#262626_0_50%,#404040_0_75%,#262626_0)] relative h-3 grow cursor-pointer rounded-full shadow-xs overflow-hidden w-64"><div class="pointer-events-none absolute inset-0 ring-1 ring-black/10 ring-inset dark:ring-white/10" style="background-image: linear-gradient(to right, rgb(99 102 241 / 0), rgb(99 102 241 / 1))"></div></div>
</div>
</div>
<div class="flex-none w-[280px]">
<div data-probe="alpha-red" class="flex">
<div class="bg-white bg-[conic-gradient(#d4d4d4_25%,#fff_0_50%,#d4d4d4_0_75%,#fff_0)] bg-[length:12px_12px] dark:bg-neutral-900 dark:bg-[conic-gradient(#404040_25%,#262626_0_50%,#404040_0_75%,#262626_0)] relative h-3 grow cursor-pointer rounded-full shadow-xs overflow-hidden w-64"><div class="pointer-events-none absolute inset-0 ring-1 ring-black/10 ring-inset dark:ring-white/10" style="background-image: linear-gradient(to right, rgb(239 68 68 / 0), rgb(239 68 68 / 1))"></div></div>
</div>
</div>
</div>
<div data-probe="panel" class="dark flex flex-wrap items-start gap-6 bg-background p-6 text-foreground">
<div class="flex-none w-[280px]">
<div data-probe="area-indigo" class="flex">
<div class="relative h-40 shrink-0 cursor-crosshair rounded-md shadow-xs select-none w-64" style="background-color: rgb(0 5 255 / 1)"><div class="pointer-events-none absolute inset-0 rounded-md bg-linear-to-r from-white to-transparent"></div><div class="pointer-events-none absolute inset-0 rounded-md bg-linear-to-t from-black to-transparent ring-1 ring-black/10 ring-inset dark:ring-white/10"></div></div>
</div>
</div>
<div class="flex-none w-[280px]">
<div data-probe="area-amber" class="flex">
<div class="relative h-40 shrink-0 cursor-crosshair rounded-md shadow-xs select-none w-64" style="background-color: rgb(255 160 0 / 1)"><div class="pointer-events-none absolute inset-0 rounded-md bg-linear-to-r from-white to-transparent"></div><div class="pointer-events-none absolute inset-0 rounded-md bg-linear-to-t from-black to-transparent ring-1 ring-black/10 ring-inset dark:ring-white/10"></div></div>
</div>
</div>
<div class="flex-none w-[280px]">
<div data-probe="hue-track" class="flex">
<div class="relative h-3 grow cursor-pointer rounded-full shadow-xs w-64" style="background-image: linear-gradient(to right in srgb, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00)"></div>
</div>
</div>
<div class="flex-none w-[280px]">
<div data-probe="alpha-indigo" class="flex">
<div class="bg-white bg-[conic-gradient(#d4d4d4_25%,#fff_0_50%,#d4d4d4_0_75%,#fff_0)] bg-[length:12px_12px] dark:bg-neutral-900 dark:bg-[conic-gradient(#404040_25%,#262626_0_50%,#404040_0_75%,#262626_0)] relative h-3 grow cursor-pointer rounded-full shadow-xs overflow-hidden w-64"><div class="pointer-events-none absolute inset-0 ring-1 ring-black/10 ring-inset dark:ring-white/10" style="background-image: linear-gradient(to right, rgb(99 102 241 / 0), rgb(99 102 241 / 1))"></div></div>
</div>
</div>
<div class="flex-none w-[280px]">
<div data-probe="alpha-red" class="flex">
<div class="bg-white bg-[conic-gradient(#d4d4d4_25%,#fff_0_50%,#d4d4d4_0_75%,#fff_0)] bg-[length:12px_12px] dark:bg-neutral-900 dark:bg-[conic-gradient(#404040_25%,#262626_0_50%,#404040_0_75%,#262626_0)] relative h-3 grow cursor-pointer rounded-full shadow-xs overflow-hidden w-64"><div class="pointer-events-none absolute inset-0 ring-1 ring-black/10 ring-inset dark:ring-white/10" style="background-image: linear-gradient(to right, rgb(239 68 68 / 0), rgb(239 68 68 / 1))"></div></div>
</div>
</div>
</div>
</div>
<pre id="out" style="display: none"></pre>
<script>
document.fonts.ready.then(() => Promise.all([...document.fonts].map(f => f.load()))).then(() => {
  const out = [];
  for (const e of document.querySelectorAll("[data-probe]")) {
    const r = e.getBoundingClientRect();
    out.push([e.dataset.probe, r.left + scrollX, r.top + scrollY, r.width, r.height]);
  }
  document.getElementById("out").textContent = "BEGIN" + JSON.stringify(out) + "END";
});
</script>
</body>
</html>
