</div>
<div data-probe="total" class="flex w-[280px]">
<div role="group" data-probe="total-group" class="flex -space-x-2"><div class="relative flex size-8 shrink-0 overflow-hidden rounded-full select-none ring-2 ring-background"><div class="flex size-full items-center justify-center rounded-full text-sm bg-red-600 text-white">MT</div></div><div class="relative flex size-8 shrink-0 overflow-hidden rounded-full select-none ring-2 ring-background"><div class="flex size-full items-center justify-center rounded-full text-sm bg-emerald-700 text-white">AL</div></div><div class="relative flex size-8 shrink-0 overflow-hidden rounded-full select-none ring-2 ring-background"><div class="flex size-full items-center justify-center rounded-full text-sm bg-sky-700 text-white">AT</div></div><div dir="rtl" class="relative flex size-8 shrink-0 overflow-hidden rounded-full select-none ring-2 ring-background"><div class="flex size-full items-center justify-center rounded-full bg-muted text-sm text-muted-foreground">+9</div></div></div>
</div>
</div>
<div data-probe="panel" dir="rtl" class="dark flex flex-wrap items-start gap-6 bg-background p-6 text-foreground">
<div data-probe="all" class="flex w-[280px]">
<div role="group" data-probe="all-group" class="flex -space-x-2"><div class="relative flex size-8 shrink-0 overflow-hidden rounded-full select-none ring-2 ring-background"><div class="flex size-full items-center justify-center rounded-full text-sm bg-red-600 text-white">MT</div></div><div class="relative flex size-8 shrink-0 overflow-hidden rounded-full select-none ring-2 ring-background"><div class="flex size-full items-center justify-center rounded-full text-sm bg-emerald-700 text-white">AL</div></div><div class="relative flex size-8 shrink-0 overflow-hidden rounded-full select-none ring-2 ring-background"><div class="flex size-full items-center justify-center rounded-full text-sm bg-sky-700 text-white">AT</div></div><div class="relative flex size-8 shrink-0 overflow-hidden rounded-full select-none ring-2 ring-background"><div class="flex size-full items-center justify-center rounded-full text-sm bg-violet-600 text-white">GH</div></div></div>

</div>
</div>
</div>
<pre id="out" style="display: none"></pre>
<script>
document.fonts.ready.then(() => Promise.all([...document.fonts].map(f => f.load()))).then(() => {
  const out = [];
  for (const e of document.querySelectorAll("[data-probe]")) {
    const r = e.getBoundingClientRect();
    out.push([e.dataset.probe, r.left + scrollX, r.top + scrollY, r.width, r.height]);
  }
  document.getElementById("out").textContent = "BEGIN" + JSON.stringify(out) + "END";
});
</script>
</body>
