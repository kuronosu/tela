<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="gallery.css">
</head>
<body class="bg-white">
<div data-probe="page" class="w-[800px]">
<div data-probe="panel" class="flex flex-wrap items-start gap-6 bg-background p-6 text-foreground">
<div data-probe="dimensions" class="flex w-[320px]">
<div role="dialog" data-probe="dimensions-panel" data-slot="popover-content" class="w-72 rounded-md border bg-popover p-4 text-popover-foreground shadow-md outline-hidden"><div class="grid gap-4"><div class="space-y-2"><h4 class="leading-none font-medium">Dimensions</h4><p class="text-sm text-muted-foreground">Set the dimensions for the layer.</p></div><div class="grid gap-2"><div class="grid grid-cols-3 items-center gap-4"><label class="flex items-center gap-2 text-sm leading-none font-medium select-none group-data-[disabled=true]:pointer-events-none group-data-[disabled=true]:opacity-50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50">Width</label><input value="100%" class="w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm dark:bg-input/30 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 col-span-2 h-8"></div><div class="grid grid-cols-3 items-center gap-4"><label class="flex items-center gap-2 text-sm leading-none font-medium select-none group-data-[disabled=true]:pointer-events-none group-data-[disabled=true]:opacity-50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50">Max. height</label><input value="none" class="w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm dark:bg-input/30 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 col-span-2 h-8"></div></div></div></div>
</div>
<div data-probe="text" class="flex w-[320px]">
<div role="dialog" data-probe="text-panel" data-slot="popover-content" class="w-72 rounded-md border bg-popover p-4 text-popover-foreground shadow-md outline-hidden"><p class="text-sm">Place content for the popover here.</p></div>
</div>
<div data-probe="class" class="flex w-[320px]">
<div role="dialog" data-probe="class-panel" data-slot="popover-content" class="rounded-md border bg-popover p-4 text-popover-foreground shadow-md outline-hidden w-48"><p class="text-sm">Place content for the popover here.</p></div>
</div>
</div>
<div data-probe="panel" class="dark flex flex-wrap items-start gap-6 bg-background p-6 text-foreground">
<div data-probe="dimensions" class="flex w-[320px]">
<div role="dialog" data-probe="dimensions-panel" data-slot="popover-content" class="w-72 rounded-md border bg-popover p-4 text-popover-foreground shadow-md outline-hidden"><div class="grid gap-4"><div class="space-y-2"><h4 class="leading-none font-medium">Dimensions</h4><p class="text-sm text-muted-foreground">Set the dimensions for the layer.</p></div><div class="grid gap-2"><div class="grid grid-cols-3 items-center gap-4"><label class="flex items-center gap-2 text-sm leading-none font-medium select-none group-data-[disabled=true]:pointer-events-none group-data-[disabled=true]:opacity-50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50">Width</label><input value="100%" class="w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm dark:bg-input/30 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 col-span-2 h-8"></div><div class="grid grid-cols-3 items-center gap-4"><label class="flex items-center gap-2 text-sm leading-none font-medium select-none group-data-[disabled=true]:pointer-events-none group-data-[disabled=true]:opacity-50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50">Max. height</label><input value="none" class="w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm dark:bg-input/30 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 col-span-2 h-8"></div></div></div></div>
</div>
<div data-probe="text" class="flex w-[320px]">
<div role="dialog" data-probe="text-panel" data-slot="popover-content" class="w-72 rounded-md border bg-popover p-4 text-popover-foreground shadow-md outline-hidden"><p class="text-sm">Place content for the popover here.</p></div>
</div>
<div data-probe="class" class="flex w-[320px]">
<div role="dialog" data-probe="class-panel" data-slot="popover-content" class="rounded-md border bg-popover p-4 text-popover-foreground shadow-md outline-hidden w-48"><p class="text-sm">Place content for the popover here.</p></div>
</div>
</div>
</div>
<pre id="out" style="display: none"></pre>
<script>
document.fonts.ready.then(() => Promise.all([...document.fonts].map(f => f.load()))).then(() => {
  const out = [];
  for (const e of document.querySelectorAll("[data-probe]")) {
    const r = e.getBoundingClientRect();
    out.push([e.dataset.probe, r.left + scrollX, r.top + scrollY, r.width, r.height]);
  }
  document.getElementById("out").textContent = "BEGIN" + JSON.stringify(out) + "END";
});
</script>
</body>
</html>
